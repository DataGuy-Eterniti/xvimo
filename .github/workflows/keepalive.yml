# Pings the Xvimo Space every 6 hours so the free Hugging Face Space never goes to sleep
# while judges and beta users may open it.
name: Keep Xvimo awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health and demo
        run: |
          URL="${{ vars.XVIMO_URL }}"
          curl -fsS --max-time 120 "$URL/health" && echo
          curl -fsS --max-time 120 -o /dev/null -w "demo %{http_code}\n" "$URL/demo"
